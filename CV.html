    <!-- Projects -->

        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>

        </svg> -->
      </a>
    </li>

    <!-- Publications -->
    <li>
      <a href="publications.html" data-label="Publications" aria-label="Publications" class="side-nav__link icon-publications">
        <!-- <img src="images/books.svg" alt="a symbol for a book" class="side-nav__icon"> -->
        <!-- Book icon 
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 5a3 3 0 0 1 3-3h11v20H7a3 3 0 0 0-3 3z" fill="none" stroke-width="1.5"/>

    <!-- CV / Download -->

      <a href="CV.html" data-label="Download CV" aria-label="Download CV" class="side-nav__link icon-download">

        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3v12m0 0l4-4m-4 4l-4-4" stroke-width="1.5" fill="none"/>

  <main style="padding: 1.5rem var(--page-pad, 1rem); max-width: var(--maxw); margin: 0 auto;">
    <section id="cv">
      <h2>Curriculum Vitae</h2>

      <!-- Actions -->
      <div class="cv-actions" style="display:flex; gap:.75rem; flex-wrap:wrap; margin:.5rem 0 1rem;">
        <a class="btn" href="papers/FilipBircaninCV.pdf" target="_blank" rel="noopener noreferrer">Open in browser</a>
        <a class="btn" href="papers/FilipBircaninCV.pdf" download="FilipBircaninCV.pdf">Download PDF</a>
      </div>

      <!-- Inline PDF viewer -->
      <div class="cv-frame-wrap" style="background:var(--surface, #fff); border:1px solid var(--border, #ddd); border-radius:12px; overflow:hidden;">
        <iframe
          class="cv-frame"
          src="papers/Simple_CV_icons.pdf#toolbar=1&navpanes=0&scrollbar=1&view=FitH"
          title="Filip Bircanin — CV PDF"
          style="width:100%; height:80vh; border:0; display:block;"
          onerror="this.replaceWith(Object.assign(document.createElement('p'),{textContent:'PDF not found at papers/Simple_CV_icons.pdf',style:'padding:1rem;color:#b00'}));">
        </iframe>
      </div>

      <p class="assist" style="color:var(--text-muted, #666); font-size:.9rem; margin-top:.75rem;">
        If the viewer doesn’t load, use
        <a href="papers/FilipBircaninCV.pdf" target="_blank" rel="noopener noreferrer">Open in browser</a>
        or the
        <a href="papers/FilipBircaninCV.pdf" download="FilipBircaninCV.pdf">Download PDF</a>
        button above.
      </p>
    </section>
  </main>

  <footer>© 2025 Filip Bircanin • <strong>filip.bircanin@kcl.ac.uk</strong></footer>
  <script src="script.js" defer></script>
