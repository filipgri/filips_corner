<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Download CV — Filip Bircanin</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!-- Header / Nav -->
  <header class="site-header">
    <h1 class="logo">Filip Bircanin</h1>
    <button id="navToggle" class="hamburger" aria-label="Open Menu">☰</button>
    <nav id="siteNav">
      <a href="index.html">About</a>
      <a href="projects.html">Projects</a>
      <a href="publications.html">Publications</a>
      <a href="CV.html" class="active">Download CV</a>
    </nav>
  </header>

  <main style="padding: 1.5rem var(--page-pad, 1rem); max-width: var(--maxw); margin: 0 auto;">
    <section id="cv">
      <h2>Curriculum Vitae</h2>

      <!-- Actions -->
      <div class="cv-actions" style="display:flex; gap:.75rem; flex-wrap:wrap; margin:.5rem 0 1rem;">
        <a class="btn" href="papers/Simple_CV_icons.pdf" target="_blank" rel="noopener noreferrer">Open in browser</a>
        <a class="btn" href="papers/Simple_CV_icons.pdf" download="Filip_Bircanin_CV.pdf">Download PDF</a>
      </div>

      <!-- Inline PDF viewer -->
      <div class="cv-frame-wrap" style="background:var(--surface, #fff); border:1px solid var(--border, #ddd); border-radius:12px; overflow:hidden;">
        <iframe
          class="cv-frame"
          src="papers/Simple_CV_icons.pdf#toolbar=1&navpanes=0&scrollbar=1&view=FitH"
          title="Filip Bircanin — CV PDF"
          style="width:100%; height:80vh; border:0; display:block;"
          onerror="this.replaceWith(Object.assign(document.createElement('p'),{textContent:'PDF not found at papers/Simple_CV_icons.pdf',style:'padding:1rem;color:#b00'}));">
        </iframe>
      </div>

      <p class="assist" style="color:var(--text-muted, #666); font-size:.9rem; margin-top:.75rem;">
        If the viewer doesn’t load, use
        <a href="papers/Simple_CV_icons.pdf" target="_blank" rel="noopener noreferrer">Open in browser</a>
        or the
        <a href="papers/Simple_CV_icons.pdf" download="Filip_Bircanin_CV.pdf">Download PDF</a>
        button above.
      </p>
    </section>
  </main>

  <footer>© 2025 Filip Bircanin • <strong>filip.bircanin@kcl.ac.uk</strong></footer>
  <script src="script.js" defer></script>
</body>
</html>
